; Test configuration for CRYOWRF unit tests. 
; Necessary for SNOWPACK/MeteoIO initialization. As well as the following files:
;
; - ./input/test_station.smet should exist with valid data for tests to run.

[General]
BUFF_CHUNK_SIZE = 370
BUFF_BEFORE = 1.5

[Input]
COORDSYS = UPS
COORDPARAM = S
TIME_ZONE = 0

METEO = SMET
METEOPATH = ./input
STATION1 = test_station

[Output]
COORDSYS = UPS
COORDPARAM = S
TIME_ZONE = 0

METEOPATH = ./output
METEO = SMET

TS_WRITE = false
TS_FORMAT = SMET
TS_START = 0.0
TS_DAYS_BETWEEN = 1.0

PROF_WRITE = false
PROF_FORMAT = PRO
PROF_START = 0.0
PROF_DAYS_BETWEEN = 1.0

SNOW_WRITE = false

BACKUP_DAYS_BETWEEN = 3000.0
FIRST_BACKUP = 3000.0
AVGSUM_TIME_SERIES = false
CLASSIFY_PROFILE = false
PRECIP_RATES = false
CUMSUM_MASS = false
EXPERIMENT = test

[Snowpack]
MEAS_TSS = false
ENFORCE_MEASURED_SNOW_HEIGHTS = false
SW_MODE = INCOMING
FORCING = ATMOS
HEIGHT_OF_WIND_VALUE = 12.
HEIGHT_OF_METEO_VALUES = 12.
ATMOSPHERIC_STABILITY = MO_HOLTSLAG
ROUGHNESS_LENGTH = 0.002
CALCULATION_STEP_LENGTH = 15.0
METEO_STEP_LENGTH = 15.0
CHANGE_BC = false
THRESH_CHANGE_BC = -1.0
SNP_SOIL = false
SOIL_FLUX = false
GEO_HEAT = 0.00
CANOPY = false

[SnowpackAdvanced]
VARIANT = ANTARCTICA
MAX_NUMBER_MEAS_TEMPERATURES = 7
MEAS_INCOMING_LONGWAVE = true
ALLOW_ADAPTIVE_TIMESTEPPING = true
HN_DENSITY = EVENT
SNOW_EROSION = false
SNOW_REDISTRIBUTION = false
NUMBER_SLOPES = 1
MASS_BALANCE = false
ALPINE3D = false
FORCE_ADD_SNOWFALL = true
MINIMUM_L_ELEMENT = 0.001
REDUCE_N_ELEMENTS = 2
HEIGHT_NEW_ELEM = 0.001
COMBINE_ELEMENTS = true
COMB_THRESH_L = 0.01
ADJUST_HEIGHT_OF_WIND_VALUE = false
ALBEDO_PARAMETERIZATION = LEHNING_2
SNOW_ALBEDO = PARAMETERIZED
SOOT_PPMV = 0.0
SW_ABSORPTION_SCHEME = MULTI_BAND
ENABLE_VAPOUR_TRANSPORT = false
JAM = false
LB_COND_WATERFLUX = FREEDRAINAGE
METAMORPHISM_MODEL = DEFAULT
THRESH_DTEMP_AIR_SNOW = 60.0
THRESH_RAIN = 1.2
THRESH_RH = 0.0
VISCOSITY_MODEL = DEFAULT
WATERTRANSPORTMODEL_SNOW = BUCKET
WATERTRANSPORTMODEL_SOIL = BUCKET
WATER_LAYER = false
T_CRAZY_MAX = 340.0
T_CRAZY_MIN = 120.0
NEW_SNOW_GRAIN_SIZE = 0.2
SNOW_PREPARATION = false
ADVECTIVE_HEAT = false
WIND_SCALING_FACTOR = 1.0
PERP_TO_SLOPE = false
DETECT_GRASS = false

RIME_INDEX = false
PREF_FLOW_PARAM_HETEROGENEITY_FACTOR = 1.0
PREF_FLOW_PARAM_N = 0.0
PREF_FLOW_PARAM_TH = 0.1
PREF_FLOW = false

[Filters]
TA::filter1 = min_max
TA::arg1::min = 140
TA::arg1::max = 320

RH::filter1 = min_max
RH::arg1::min = 0.01
RH::arg1::max = 1.2

ISWR::filter1 = min_max
ISWR::arg1::min = -10
ISWR::arg1::max = 1500

ILWR::filter1 = min_max
ILWR::arg1::min = 30
ILWR::arg1::max = 355

VW::filter1 = min_max
VW::arg1::min = -2
VW::arg1::max = 70

[Interpolations1D]
WINDOW_SIZE = 86400

PSUM::resample = accumulate
PSUM::accumulate::period = 15

[Generators]
