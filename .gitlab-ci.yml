variables:
  DIR: "$CI_PROJECT_DIR/build"
  DEPLIBS: "$DIR/libs"
  CC: "gcc"
  CXX: "g++"
  FC: "gfortran"
  FCFLAGS: "-m64 -fallow-argument-mismatch -fallow-invalid-boz"
  F77: "gfortran"
  FFLAGS: "-m64 -fallow-argument-mismatch -fallow-invalid-boz"
  NETCDF: "/usr"
  HDF5: "/usr/lib/x86_64-linux-gnu/hdf5/serial"
  LDFLAGS: "-L/usr/lib/x86_64-linux-gnu/hdf5/serial/ -L/usr/lib"
  CPPFLAGS: "-I/usr/include/hdf5/serial/ -I/usr/include"
  LD_LIBRARY_PATH: "/usr/lib"
  TZ: "Etc/UTC"
  DEBIAN_FRONTEND: "noninteractive"
  JASPERLIB: "$DEPLIBS/grib2/lib"
  JASPERINC: "$DEPLIBS/grib2/include"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 1
  FF_ENABLE_JOB_CLEANUP: "true"
  GIT_STRATEGY: fetch

stages:
  - dependencies
  - wrf
  - integration

# Build all dependencies: Jasper, MeteoIO, Snowpack, and CryoWRF coupler
build-dependencies:
  stage: dependencies
  image: ubuntu:24.04
  tags:
    - docker
  script:
    # Install dependencies
    - apt-get update
    - apt-get install -y git wget build-essential cmake csh curl perl m4 gfortran gcc g++ make python3
    - apt-get install -y libpng-dev netcdf-bin libnetcdff-dev tcsh libopenmpi-dev libhdf5-dev zlib1g-dev
    # Allow file protocol for GitLab's submodule optimization (safety measure)
    - git config --global protocol.file.allow always
    # Submodules are already initialized by GitLab CI with GIT_SUBMODULE_STRATEGY: recursive
    # If triggered from CRYOWRF, checkout the specific commit
    - |
      if [ -n "$CRYOWRF_COMMIT_SHA" ]; then
        echo "=== Integration Test Triggered from CRYOWRF ==="
        echo "Testing with CRYOWRF commit: $CRYOWRF_COMMIT_SHA"
        echo "From branch: $CRYOWRF_BRANCH"
        echo "Pipeline ID: $CRYOWRF_PIPELINE_ID"
        echo "=============================================="
        cd phys/cryowrf
        # Fetch using CI job token for authentication
        git config --local credential.helper '!f() { echo "username=gitlab-ci-token"; echo "password=$CI_JOB_TOKEN"; }; f'
        # Fetch the specific branch that contains the commit
        git fetch origin "$CRYOWRF_BRANCH"
        git checkout $CRYOWRF_COMMIT_SHA
        # Update submodules to match this commit (meteoio, snowpack, etc.)
        git submodule update --init --recursive
        cd ../..
        echo "Successfully checked out CRYOWRF commit $CRYOWRF_COMMIT_SHA with its submodules"
      fi

    # Build Jasper library (meteoio, snowpack, and coupler will be built by WRF)
    - echo "Building Jasper..."
    - mkdir -p "$DIR"
    - mkdir -p "$DEPLIBS/grib2"
    - cd "$DIR"
    - wget https://www2.mmm.ucar.edu/wrf/OnLineTutorial/compile_tutorial/tar_files/jasper-1.900.1.tar.gz -O jasper.tar.gz
    - tar -xzf jasper.tar.gz
    - cd jasper-1.900.1
    # Unset Fortran flags that interfere with C compilation
    - unset FCFLAGS FFLAGS F77 FC
    - export CFLAGS="-O3 -fPIC"
    - export CXXFLAGS="-O3 -fPIC"
    - ./configure --prefix="$DEPLIBS/grib2" || (cat config.log && exit 1)
    - make -j$(nproc) && make install
  artifacts:
    paths:
      - build/libs
    expire_in: 2h
  rules:
    - if: '$ENSURE_ARTIFACTS == "true"'  # Skip if just checking artifacts
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH'
      when: always

# Build WRF with CRYOWRF integration
build-wrf:
  stage: wrf
  image: ubuntu:24.04
  tags:
    - docker
  dependencies:
    - build-dependencies
  needs:
    - job: build-dependencies
  script:
    # Install dependencies
    - apt-get update
    - apt-get install -y git wget build-essential cmake csh curl perl m4 gfortran gcc g++ make python3
    - apt-get install -y libpng-dev netcdf-bin libnetcdff-dev tcsh libopenmpi-dev libhdf5-dev zlib1g-dev
    # Allow file protocol for GitLab's submodule optimization (safety measure)
    - git config --global protocol.file.allow always
    # Submodules are already initialized by GitLab CI with GIT_SUBMODULE_STRATEGY: recursive
    # If triggered from CRYOWRF, checkout the specific commit
    - |
      if [ -n "$CRYOWRF_COMMIT_SHA" ]; then
        echo "=== Testing with CRYOWRF commit $CRYOWRF_COMMIT_SHA ==="
        cd phys/cryowrf
        # Fetch using CI job token for authentication
        git config --local credential.helper '!f() { echo "username=gitlab-ci-token"; echo "password=$CI_JOB_TOKEN"; }; f'
        # Fetch the specific branch that contains the commit
        git fetch origin "$CRYOWRF_BRANCH"
        git checkout $CRYOWRF_COMMIT_SHA
        # Update submodules to match this commit (meteoio, snowpack, etc.)
        git submodule update --init --recursive
        cd ../..
      fi

    - mkdir -p "$DIR/bin"
    - cd "$CI_PROJECT_DIR"
    # Set Jasper environment variables
    - export JASPER="$DEPLIBS/grib2"
    - export JASPER_ROOT="$DEPLIBS/grib2"
    - export JASPERLIB="$DEPLIBS/grib2/lib"
    - export JASPERINC="$DEPLIBS/grib2/include"
    # Clean previous builds
    - ./clean -a
    # Fix netcdf path in configure script
    - sed -i 's#$NETCDF/lib#$NETCDF/lib/x86_64-linux-gnu#g' configure
    # Select em_real configuration (option 35 for gfortran with basic nesting)
    - printf "35\n1\n" | ./configure
    # Fix netcdf link flags in configure.wrf
    - sed -i 's#-L/usr/lib -lnetcdff -lnetcdf#-L/usr/lib/x86_64-linux-gnu -lnetcdff -lnetcdf#g' configure.wrf
    # Compile WRF
    - ./compile em_real -j $(nproc) 2>&1 | tee compile.log
    # Check if WRF executables were created
    - test -f main/wrf.exe || (echo "WRF compilation failed! Check compile.log" && exit 1)
    - test -f main/real.exe || (echo "real.exe compilation failed! Check compile.log" && exit 1)
    # Copy executables to build directory
    - cp main/wrf.exe "$DIR/bin/"
    - cp main/real.exe "$DIR/bin/"
    - cp main/ndown.exe "$DIR/bin/" 2>/dev/null || true
    - cp main/tc.exe "$DIR/bin/" 2>/dev/null || true
    # Copy only necessary WRF files for WPS (minimal artifact size)
    - mkdir -p "$DIR/WRF"
    - echo "Copying minimal WRF artifacts for WPS..."
    # Copy configure.wrf (required by WPS configure script)
    - cp configure.wrf "$DIR/WRF/"
    # Copy WRF I/O libraries (required for WPS linking)
    - mkdir -p "$DIR/WRF/external/io_netcdf" "$DIR/WRF/external/io_grib1" "$DIR/WRF/external/io_grib_share" "$DIR/WRF/external/io_int"
    - cp -r external/io_netcdf/*.a external/io_netcdf/*.h "$DIR/WRF/external/io_netcdf/" 2>/dev/null || true
    - cp -r external/io_grib1/*.a external/io_grib1/*.h "$DIR/WRF/external/io_grib1/" 2>/dev/null || true
    - cp -r external/io_grib_share/*.a external/io_grib_share/*.h "$DIR/WRF/external/io_grib_share/" 2>/dev/null || true
    - cp -r external/io_int/*.a external/io_int/*.h "$DIR/WRF/external/io_int/" 2>/dev/null || true
    # Copy grib1 subdirectories (needed by WPS metgrid)
    - cp -r external/io_grib1/grib1_util external/io_grib1/MEL_grib1 external/io_grib1/WGRIB "$DIR/WRF/external/io_grib1/" 2>/dev/null || true
    # Copy WRF frame objects and modules (required by WPS geogrid/metgrid)
    - mkdir -p "$DIR/WRF/frame"
    - cp frame/module_driver_constants.o frame/pack_utils.o frame/module_machine.o frame/module_internal_header_util.o "$DIR/WRF/frame/" 2>/dev/null || true
    - cp frame/*.mod "$DIR/WRF/frame/" 2>/dev/null || true
    # Copy include directory
    - mkdir -p "$DIR/WRF/inc"
    - cp inc/*.h inc/*.inc "$DIR/WRF/inc/" 2>/dev/null || true
    # Verify critical WRF files were copied for WPS
    - test -f "$DIR/WRF/configure.wrf" || (echo "ERROR - configure.wrf not copied!" && exit 1)
    - test -f "$DIR/WRF/external/io_netcdf/libwrfio_nf.a" || (echo "ERROR - libwrfio_nf.a not copied!" && exit 1)
    - test -d "$DEPLIBS/grib2" || (echo "ERROR - Jasper library missing!" && exit 1)
    - echo "Minimal WRF artifacts ready for WPS ($(du -sh $DIR/WRF | cut -f1))"
    - ls -lh "$DIR/bin/" "$DEPLIBS/grib2/lib/" "$DIR/WRF/external/io_netcdf/"
  artifacts:
    paths:
      - build/
    expire_in: 3 days
  rules:
    - if: '$ENSURE_ARTIFACTS == "true"'  # Skip if just checking artifacts
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH'
      when: always

# Trigger CRYOWRF-WPS build to verify WPS builds with this WRF version
trigger-wps-build:
  stage: integration
  trigger:
    project: atmospheric-models/CRYOWRF-WPS
    branch: master
    strategy: depend  # Wait for WPS build to complete
  variables:
    WRF_PIPELINE_ID: $CI_PIPELINE_ID
    WRF_COMMIT_SHA: $CI_COMMIT_SHA
    WRF_BRANCH: $CI_COMMIT_REF_NAME
    # Pass through CRYOWRF variables for full integration tracking
    CRYOWRF_COMMIT_SHA: $CRYOWRF_COMMIT_SHA
    CRYOWRF_BRANCH: $CRYOWRF_BRANCH
    CRYOWRF_PIPELINE_ID: $CRYOWRF_PIPELINE_ID
  rules:
    - if: '$ENSURE_ARTIFACTS == "true"'  # Skip if just checking artifacts
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH'
      when: always
